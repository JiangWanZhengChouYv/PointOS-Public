<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>悬浮计分球</title>
    <link rel="stylesheet" href="widget.css">
</head>
<body data-state="collapsed" data-mode="group">
    <div id="ball" class="ball" role="button" tabindex="0" aria-label="展开悬浮计分球" data-tauri-drag-region="deep">
        <svg viewBox="0 0 100 100" class="ball-art" aria-hidden="true" focusable="false">
            <defs>
                <linearGradient id="ballBg" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0" stop-color="#667eea"/>
                    <stop offset="1" stop-color="#764ba2"/>
                </linearGradient>
            </defs>
            <rect width="100" height="100" fill="url(#ballBg)"/>
            <rect x="24" y="56" width="14" height="20" rx="4" fill="#ffffff" opacity="0.8"/>
            <rect x="43" y="42" width="14" height="34" rx="4" fill="#ffffff" opacity="0.9"/>
            <rect x="62" y="28" width="14" height="48" rx="4" fill="#ffffff"/>
        </svg>
        <span id="ballSubject" class="ball-subject">语</span>
    </div>

    <section id="panel" class="panel" hidden>
        <header class="panel-head" data-tauri-drag-region="deep">
            <div class="tabs" role="tablist" aria-label="计分对象">
                <button type="button" id="tabGroup" class="tab is-active" role="tab" aria-selected="true">小组</button>
                <button type="button" id="tabMember" class="tab" role="tab" aria-selected="false">个人</button>
            </div>
            <span id="panelSubject" class="panel-subject">语文</span>
            <button type="button" id="collapse" class="icon-btn" aria-label="收起悬浮球">&#10005;</button>
        </header>

        <p id="feedback" class="feedback" role="status" aria-live="polite" hidden></p>

        <div id="crumb" class="crumb" hidden>
            <button type="button" id="back" class="crumb-back">&#8592; 返回</button>
            <span id="crumbTarget" class="crumb-target"></span>
        </div>

        <ul id="list" class="list"></ul>

        <footer class="panel-foot">
            <button type="button" id="openMain" class="ghost-btn">打开主界面</button>
        </footer>
    </section>

    <script src="widget.js" defer></script>
</body>
</html>
